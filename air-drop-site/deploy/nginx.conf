# Modelo HTTP. Configure HTTPS/certificado no seu provedor ou no Nginx antes de anunciar.
# Copie apenas dist/ para /var/www/airdrop. Não publique src/, docs/ ou deploy/.
server {
    listen 80;
    listen [::]:80;
    server_name seudominio.com.br www.seudominio.com.br;
    root /var/www/airdrop;
    index index.html;
    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
    location ~* \.(css|js|webp|png|jpg|jpeg|svg|ico)$ {
        try_files $uri =404;
        expires 1h;
    }
    error_page 404 /404.html;
    location = /404.html { internal; }
    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;
}
